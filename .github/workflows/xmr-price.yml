name: Update XMR Binance reference card

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xmr-price.yml"

permissions:
  contents: write

jobs:
  update-xmr-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Binance reference price and render SVG
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import html
          import re
          import urllib.request
          from pathlib import Path

          urls = [
              "https://www.binance.com/en/price/monero/USD",
              "https://www.binance.com/en/price/monero",
          ]

          headers = {
              "User-Agent": "Mozilla/5.0 (XMR profile price card; GitHub Actions)",
              "Accept-Language": "en-US,en;q=0.9",
          }

          page = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      page = response.read().decode("utf-8", "ignore")
                  if page:
                      break
              except Exception:
                  continue

          if not page:
              raise SystemExit("Binance price page unavailable; keeping previous card")

          text = html.unescape(page)
          text = re.sub(r"<script[\s\S]*?</script>", " ", text, flags=re.I)
          text = re.sub(r"<style[\s\S]*?</style>", " ", text, flags=re.I)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"\s+", " ", text)

          patterns = [
              r"1\s*XMR.{0,140}?(?:US\$|\$)\s*([0-9][0-9,]*(?:\.[0-9]+)?)",
              r"XMR\s*(?:to|/)\s*USD.{0,140}?([0-9][0-9,]*(?:\.[0-9]+)?)",
              r"(?:US\$|\$)\s*([0-9]{2,5}(?:,[0-9]{3})*(?:\.[0-9]+)?)",
          ]

          price = None
          for pattern in patterns:
              for match in re.finditer(pattern, text, flags=re.I):
                  try:
                      candidate = float(match.group(1).replace(",", ""))
                  except ValueError:
                      continue
                  if 20 <= candidate <= 5000:
                      price = candidate
                      break
              if price is not None:
                  break

          if price is None:
              raise SystemExit("Could not parse a plausible XMR price; keeping previous card")

          if price >= 1000:
              price_text = f"${price:,.2f} USD"
          else:
              price_text = f"${price:.2f} USD"

          updated = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-label="Monero XMR Binance reference price {price_text}">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#111827"/>
                <stop offset="1" stop-color="#05070b"/>
              </linearGradient>
            </defs>
            <rect width="760" height="170" rx="22" fill="url(#bg)"/>
            <rect x="1" y="1" width="758" height="168" rx="21" fill="none" stroke="#2b313b"/>
            <circle cx="73" cy="85" r="43" fill="#ff6600"/>
            <text x="73" y="77" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">XMR</text>
            <text x="73" y="101" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="12">MONERO</text>
            <text x="140" y="48" fill="#9ca3af" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">MONERO MARKET WATCH</text>
            <text x="140" y="94" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">{price_text}</text>
            <text x="140" y="124" fill="#f3ba2f" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700">BINANCE REFERENCE PRICE</text>
            <text x="140" y="148" fill="#6b7280" font-family="Arial,Helvetica,sans-serif" font-size="12">Updated {updated} • XMR is not a Binance spot trading pair</text>
          </svg>'''

          Path("assets").mkdir(exist_ok=True)
          Path("assets/xmr-binance.svg").write_text(svg, encoding="utf-8")
          print(f"Rendered XMR card at {price_text}")
          PY

      - name: Commit updated card when price changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/xmr-binance.svg
          if git diff --cached --quiet; then
            echo "No card change to commit"
          else
            git commit -m "chore: refresh XMR Binance reference price"
            git push
          fi
