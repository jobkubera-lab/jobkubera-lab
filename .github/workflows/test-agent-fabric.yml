name: Test KUBERA Agent Fabric

on:
  pull_request:
    paths:
      - "research/kubera-agent-fabric/**"
      - ".github/workflows/test-agent-fabric.yml"
  push:
    branches: [main]
    paths:
      - "research/kubera-agent-fabric/**"
      - ".github/workflows/test-agent-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: research/kubera-agent-fabric/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -v
