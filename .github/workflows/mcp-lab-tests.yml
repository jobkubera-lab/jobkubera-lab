name: MCP Lab Tests

on:
  pull_request:
    paths:
      - 'kubera-lab/mcp-lab/**'
      - '.github/workflows/mcp-lab-tests.yml'
  push:
    branches: [main]
    paths:
      - 'kubera-lab/mcp-lab/**'
      - '.github/workflows/mcp-lab-tests.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install MCP Lab
        working-directory: kubera-lab/mcp-lab
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        working-directory: kubera-lab/mcp-lab
        run: python -m py_compile shared/policy.py servers/*.py
      - name: Run tests
        working-directory: kubera-lab/mcp-lab
        run: pytest

  gateway-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install gateway dependencies
        working-directory: kubera-lab/mcp-lab/gateway
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck gateway
        working-directory: kubera-lab/mcp-lab/gateway
        run: npm run typecheck
