name: Test Innovation Stack Reference

on:
  pull_request:
    paths:
      - "kubera-lab/innovation-stack/reference-implementation/**"
      - ".github/workflows/test-innovation-stack-reference.yml"
  push:
    branches: [main]
    paths:
      - "kubera-lab/innovation-stack/reference-implementation/**"
      - ".github/workflows/test-innovation-stack-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: kubera-lab/innovation-stack/reference-implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install reference package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run safe demo
        run: python -m kubera_innovation demo --json

  coverage:
    name: coverage-baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kubera-lab/innovation-stack/reference-implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install reference package and coverage tool
        run: |
          python -m pip install -e .
          python -m pip install coverage
      - name: Measure source branch coverage
        run: |
          coverage run --branch --source=kubera_innovation -m unittest discover -s tests -q
          coverage report --show-missing
