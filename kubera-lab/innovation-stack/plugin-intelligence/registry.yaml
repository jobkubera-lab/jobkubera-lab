    upstream: https://github.com/00080000/dsh-project-memory
    source_category: memory
    kubera_targets: [project-memory, reality-graph, life-system-compiler]
    license_status: UNKNOWN_REVIEW_REQUIRED
    security_status: NOT_REVIEWED
    risk: MEDIUM
    verdict: CANDIDATE
  - id: dsh-telemetry-redactor
    upstream: https://github.com/030611/dsh-telemetry-redactor
    source_category: security
    kubera_targets: [context-privacy-gate, external-intelligence-node]
    license_status: UNKNOWN_REVIEW_REQUIRED
    security_status: NOT_REVIEWED
    risk: HIGH
    verdict: CANDIDATE
  - id: dsh-verification-receipt
    upstream: https://github.com/030611/dsh-verification-receipt
    source_category: security
    kubera_targets: [evidence-ledger, proof-of-work-portfolio]
    license_status: UNKNOWN_REVIEW_REQUIRED
    security_status: NOT_REVIEWED
    risk: MEDIUM
    verdict: CANDIDATE
  - id: qiushi-dsh-evidence-audit
    upstream: https://github.com/030611/qiushi-dsh-evidence-audit
    source_category: security
    kubera_targets: [evidence-ledger, decision-replay]
