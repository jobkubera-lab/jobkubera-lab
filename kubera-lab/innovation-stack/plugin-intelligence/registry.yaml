version: 1
source_catalogs:
  - id: awesome-dsh-plugin
    url: https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
    catalog_license: CC0-1.0
    trust: DISCOVERY_ONLY
    note: individual plugin licenses and code must be reviewed separately
pipeline:
  - DISCOVER
  - SOURCE_VERIFY
  - LICENSE_CHECK
  - SECURITY_REVIEW
  - COMPATIBILITY_REVIEW
  - HUMAN_APPROVAL
  - SANDBOX_TEST
  - ADOPT_OR_REJECT
candidates:
