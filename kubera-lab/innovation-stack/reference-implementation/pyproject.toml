[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubera-innovation-reference"
version = "0.5.0"
description = "Public reference implementation for KUBERA Innovation Stack contracts, hardened external intelligence and safe capability intake"
requires-python = ">=3.11"

[project.scripts]
kubera-innovation = "kubera_innovation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
