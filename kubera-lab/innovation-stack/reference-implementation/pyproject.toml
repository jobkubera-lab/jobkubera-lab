[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="kubera-innovation-reference"
version="0.9.0"
description="KUBERA Innovation Stack reference runtime — sovereign governance, evidence, handoffs and controlled execution"
requires-python=">=3.11"

[project.scripts]
kubera-innovation="kubera_innovation.cli:main"

[tool.setuptools]
package-dir={""="src"}
[tool.setuptools.packages.find]
where=["src"]
