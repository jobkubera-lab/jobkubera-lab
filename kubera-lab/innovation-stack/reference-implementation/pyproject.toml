[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubera-innovation-reference"
version = "0.2.0"
description = "Public reference implementation for selected KUBERA Innovation Stack modules and visual contracts"
requires-python = ">=3.11"

[project.scripts]
kubera-innovation = "kubera_innovation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
