<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KUBERA Agent OS — demo</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; background: #111; color: #eee; }
    header, footer { padding: 16px 20px; background: #1b1b1b; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: #bbb; font-size: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 20px; background: #161616; }
    button.tab, button.go { border: 1px solid #555; background: #222; color: #eee; padding: 8px 12px; cursor: pointer; }
    button.tab.on { background: #8a6d2b; border-color: #c4a35a; }
    button.approve { background: #2d4a2d; }
    main { padding: 20px; max-width: 820px; }
    pre, .card { background: #1c1c1c; border: 1px solid #333; padding: 12px; white-space: pre-wrap; }
    .ok { color: #9dcc9d; }
    a { color: #d4b36a; }
  </style>
</head>
<body>
  <header>
    <h1>KUBERA Agent OS</h1>
    <div class="sub">One core. Many attachments already in this GitHub. Nothing is sent until you approve.</div>
  </header>
  <nav>
    <button class="tab on" data-id="lookup-housing">Lookup</button>
    <button class="tab" data-id="events-weekend">Place / events</button>
    <button class="tab" data-id="work-reply">Work / visa</button>
    <button class="tab" data-id="approve-gate">Control</button>
  </nav>
  <main>
    <p id="meta"></p>
    <div class="card" id="brief"></div>
    <p>
      <button class="go approve" id="approve">Approve (local only)</button>
      <span id="state">approved: no</span>
    </p>
    <p class="sub">Sources stay in their repos. This page only assembles them.</p>
  </main>
  <footer class="sub">Prototype. Not a council service. Not auto-publish.</footer>
  <script>
    let jobs = [];
    let current = null;
    const brief = document.getElementById("brief");
    const meta = document.getElementById("meta");
    const state = document.getElementById("state");

    function show(id) {
      current = jobs.find(j => j.id === id) || jobs[0];
      document.querySelectorAll("button.tab").forEach(b => b.classList.toggle("on", b.dataset.id === current.id));
      meta.textContent = current.title + " · " + current.source_repo;
      const extra = current.items ? "\n- " + current.items.join("\n- ") : "";
      const url = current.official_url ? "\nURL: " + current.official_url : "";
      brief.textContent =
        "TASK: " + current.task +
        "\n\nBRIEF: " + current.brief + extra + url +
        "\n\nDRAFT ACTION:\n" + current.action_draft +
        (current.score != null ? "\n\nengineering score: " + current.score + " (not certainty)" : "");
      state.textContent = "approved: " + (current.approved ? "yes" : "no");
      state.className = current.approved ? "ok" : "";
    }

    document.getElementById("approve").onclick = function () {
      if (!current) return;
      current.approved = true;
      state.textContent = "approved: yes — still not sent";
      state.className = "ok";
    };
    document.querySelectorAll("button.tab").forEach(b => b.onclick = () => show(b.dataset.id));

    fetch("jobs.json").then(r => r.json()).then(data => { jobs = data.jobs; show("lookup-housing"); })
      .catch(() => { brief.textContent = "Place jobs.json next to this file."; });
  </script>
</body>
</html>
