    <tspan fill="#a998ff">LOCAL INTELLIGENCE</tspan><tspan fill="#6e7890">  ·  </tspan>
    <tspan fill="#ff8a57">CIVIC TECH</tspan><tspan fill="#6e7890">  ·  </tspan>
    <tspan fill="#f2c46d">INTERACTIVE MAPS</tspan>
  </text>
  <line x1="61" y1="207" x2="815" y2="207" stroke="url(#beam)" stroke-width="2" opacity="0.65"/>
  <text x="61" y="244" fill="#aeb7ca" font-family="Verdana, Arial, sans-serif" font-size="13" letter-spacing="2.2">BUILD  •  TEST  •  CONNECT  •  SHIP</text>
