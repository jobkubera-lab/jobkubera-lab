<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Nikola Kubera — KUBERA LAB">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d17"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#171020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d477"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#fff0b5"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26d9ff"/>
      <stop offset="0.38" stop-color="#8b7cff"/>
      <stop offset="0.7" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#f2c46d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="998" height="278" rx="28" fill="url(#bg)" stroke="#30384b" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="278" rx="28" fill="url(#grid)"/>
  <circle cx="890" cy="68" r="74" fill="none" stroke="#d9a441" stroke-width="3" stroke-opacity="0.4"/>
  <ellipse cx="890" cy="68" rx="96" ry="29" transform="rotate(-12 890 68)" fill="none" stroke="url(#gold)" stroke-width="5" stroke-opacity="0.9"/>
  <circle cx="890" cy="68" r="8" fill="#f2c46d" filter="url(#glow)"/>
  <rect x="58" y="44" width="160" height="3" rx="2" fill="url(#beam)"/>
  <text x="58" y="101" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="3">NIKOLA KUBERA</text>
  <text x="61" y="137" fill="#7ee7ff" font-family="'Courier New', Courier, monospace" font-size="19" font-weight="700" letter-spacing="2.5">KUBERA LAB  /  AI SOLUTIONS BUILDER</text>
  <text x="61" y="184" font-family="Trebuchet MS, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">
